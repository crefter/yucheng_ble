name: yucheng_ble
description: "Plugin for yucheng"
version: 2.2.2
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  flutter_blue_plus: ^2.2.1
  permission_handler: ^12.0.1
  device_info_plus: ^12.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  pigeon: ^26.1.7

flutter:

  plugin:
    platforms:
      android:
        package: com.crefter.yuchengplugin.yucheng_ble
        pluginClass: YuchengBlePlugin
      ios:
        pluginClass: YuchengBlePlugin
