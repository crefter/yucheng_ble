group = "com.crefter.yuchengplugin.yucheng_ble"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.2.0"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.12.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
        classpath("org.jetbrains.kotlin:kotlin-serialization:$kotlin_version")
    }
}

rootProject.allprojects {
    repositories {
        google()
        jcenter()
        flatDir {
            dirs project(':yucheng_ble').file('libs')
        }
        maven { url "https://jitpack.io" }

        maven { url 'https://maven.aliyun.com/repository/public/' }
        maven { url 'https://maven.aliyun.com/repository/google/'}
        maven { url 'https://maven.aliyun.com/repository/jcenter/'}
        mavenLocal()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply plugin: "org.jetbrains.kotlin.plugin.serialization"

android {
    namespace = "com.crefter.yuchengplugin.yucheng_ble"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    defaultConfig {
        minSdk = 24
        multiDexEnabled true
    }

    dependencies {
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        jniLibs {
            it.excludes += [
                    "**/dump_syms",
                    "**/libdump_syms.so"
            ]
        }

        resources {
            it.excludes += [
                    "**/dump_syms",
                    "**/libdump_syms.so"
            ]
        }
    }

    repositories {
        flatDir {
            dirs 'libs'
        }
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }

    aaptOptions.cruncherEnabled = false
    aaptOptions.useNewCruncher = false
}


dependencies {
    implementation('org.simpleframework:simple-xml:2.7.1') {
        exclude group: 'stax', module: 'stax-api'
        exclude group: 'xpp3', module: 'xpp3'
    }

    implementation "androidx.multidex:multidex:2.0.1"

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'org.greenrobot:eventbus:3.3.1'

    implementation 'com.google.code.gson:gson:2.10.1'

    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation("com.squareup.okhttp3:okhttp:5.3.2")

    implementation 'com.scwang.smart:refresh-layout-kernel:2.0.1'      //核心必须依赖
    implementation 'com.scwang.smart:refresh-header-classics:2.0.1'    //经典刷新头
    implementation 'com.scwang.smart:refresh-footer-classics:2.0.1'    //经典加载

    implementation 'com.yanzhenjie.recyclerview:x:1.3.2'

    implementation 'com.flyco.dialog:FlycoDialog_Lib:1.3.2@aar'

    implementation 'no.nordicsemi.android:dfu:1.10.1'

    implementation 'com.github.bumptech.glide:glide:4.12.0'
    implementation 'androidx.work:work-runtime-ktx:2.11.2'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'
    implementation('com.google.firebase:firebase-crashlytics-buildtools:3.0.0') {
        transitive = false
    }

    implementation "androidx.room:room-runtime:2.7.2"
    annotationProcessor "androidx.room:room-compiler:2.7.2"

    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.1.0'
    implementation 'com.google.errorprone:error_prone_annotations:2.49.0'
    implementation('com.alibaba:fastjson:2.0.28') {
        exclude group: 'javax.servlet', module: 'servlet-api'
        exclude group: 'org.springframework', module: 'spring-web'
        exclude group: 'javax.ws.rs', module: 'jsr311-api'
        exclude group: 'org.joda', module: 'joda-convert'
        exclude group: 'org.glassfish.jersey.core', module: 'jersey-common'
    }
    implementation 'org.apache.commons:commons-text:1.9'

//    implementation files('libs/rtk-bbpro-core-1.6.1.jar')
//    implementation files('libs/rtk-core-1.2.1.jar')
//    implementation files('libs/rtk-dfu-3.3.8.jar')
    implementation(name: 'AliAgent-release-4.1.3', ext: 'aar') {
        transitive = false
    }
    implementation(name: 'BmpConvert_V1.6.0_10604-release', ext: 'aar')
    implementation(name: 'jl_bt_ota_V1.10.0_10932-release', ext: 'aar')
    implementation(name: 'jl_rcsp_V0.7.2_527-release', ext: 'aar')
    implementation(name: 'JL_Watch_V1.13.1_11214-release', ext: 'aar')
    implementation(name: 'ycbtsdk-release-4.0.9', ext: 'aar')
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'androidx.datastore:datastore-preferences:1.2.1'
    implementation "androidx.datastore:datastore-preferences-core:1.2.1"
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'
    implementation 'androidx.security:security-crypto-ktx:1.1.0'
}